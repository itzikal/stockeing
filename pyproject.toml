[project]
name = "trading-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["strategy-kit"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
strategy-kit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["tests/strategy_fixtures/"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
